<!DOCTYPE html>
<!-- Made by YTSworks -->
<!-- YTS工作室製作 -->
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard View</title>
    <script src="/static/js/config.js"></script>
    <script>
        writeConfiguredStyles([
            '/static/css/dashboard-view.css'
        ]);
    </script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="dark-theme">
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Dashboard View</h1>
                <span class="update-time">Last update <span id="last-update">--:--:--</span></span>
            </div>
            <div class="header-right">
                <div id="cam-layout-ctrl" style="display:none;align-items:center;gap:6px;margin-right:12px;">
                    <span style="font-size:0.75rem;color:var(--text-secondary);">Camera Grid</span>
                    <button class="btn-small cam-layout-btn active" id="cam-btn-4" onclick="setCamLayout(4)" title="4 channels">2x2</button>
                    <button class="btn-small cam-layout-btn" id="cam-btn-9" onclick="setCamLayout(9)" title="9 channels">3x3</button>
                    <button class="btn-small cam-layout-btn" id="cam-btn-16" onclick="setCamLayout(16)" title="16 channels">4x4</button>
                </div>
                <button class="btn-icon" onclick="toggleFullscreen()" title="Fullscreen">
                    <span id="fullscreen-icon">FS</span>
                </button>
                <button class="btn-icon" onclick="backToModeSelection()" title="Back">BK</button>
                <button class="btn-icon btn-logout" onclick="logout()" title="Logout">LO</button>
            </div>
        </header>

        <main class="dashboard-main" id="dashboard-main">
            <div class="top-row" id="top-row">
                <section class="section topology-section">
                    <div class="section-header">
                        <h2>Topology</h2>
                        <div class="section-controls">
                            <button class="btn-small" onclick="refreshTopology()">Refresh</button>
                        </div>
                    </div>
                    <div class="section-content">
                        <div id="topology-svg" class="topology-canvas"></div>
                    </div>
                </section>

                <section class="section device-status-section">
                    <div class="section-header">
                        <h2>Device Status</h2>
                    </div>
                    <div class="section-content">
                        <div class="stats-grid">
                            <div class="stat-card stat-total">
                                <div class="stat-icon">TOT</div>
                                <div class="stat-info">
                                    <div class="stat-label">Total</div>
                                    <div class="stat-value" id="total-devices">0</div>
                                </div>
                            </div>
                            <div class="stat-card stat-online">
                                <div class="stat-icon">ON</div>
                                <div class="stat-info">
                                    <div class="stat-label">Online</div>
                                    <div class="stat-value" id="online-devices">0</div>
                                </div>
                            </div>
                            <div class="stat-card stat-offline">
                                <div class="stat-icon">OFF</div>
                                <div class="stat-info">
                                    <div class="stat-label">Offline</div>
                                    <div class="stat-value" id="offline-devices">0</div>
                                </div>
                            </div>
                            <div class="stat-card stat-warning">
                                <div class="stat-icon">ALR</div>
                                <div class="stat-info">
                                    <div class="stat-label">Warning</div>
                                    <div class="stat-value" id="warning-devices">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="device-list">
                            <h3>Devices</h3>
                            <div id="device-list-content" class="device-list-scrollable"></div>
                        </div>
                    </div>
                </section>
            </div>

            <section class="section camera-section" id="camera-section" style="display:none;">
                <div class="section-header">
                    <h2>Camera Monitor</h2>
                    <div class="section-controls">
                        <button class="btn-small" onclick="dvRefreshCameras()">Refresh</button>
                    </div>
                </div>
                <div class="section-content" style="padding:0;">
                    <div class="camera-grid cam-grid-4" id="dv-camera-grid"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        writeConfiguredScripts([
            '/static/js/api.js',
            '/static/js/utils.js',
            '/static/js/i18n.js',
            '/static/js/topology.js',
            '/static/js/camera-webrtc.js',
            '/static/js/dashboard-view.js'
        ]);
    </script>
</body>

</html>
