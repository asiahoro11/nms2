<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#38651;&#35222;&#29254;&#27169;&#24335;</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== LIGHT THEME (default) ===== */
        :root {
            --bg:        #f1f5f9;
            --bg-panel:  #ffffff;
            --bg-card:   #ffffff;
            --border:    #e2e8f0;
            --text:      #1e293b;
            --text-muted:#64748b;
            --accent:    #3b82f6;
            --green:     #10b981;
            --red:       #ef4444;
            --yellow:    #f59e0b;
            --purple:    #8b5cf6;
            --header-h:  48px;
            --topbar-h:  64px;
            --shadow:    0 4px 12px rgba(0,0,0,0.08);
        }

        /* ===== DARK THEME ===== */
        body.dark-theme {
            --bg:        #1e2128;
            --bg-panel:  #272c35;
            --bg-card:   #272c35;
            --border:    #3a4050;
            --text:      #e8ecf1;
            --text-muted:#8b96a8;
            --shadow:    0 4px 12px rgba(0,0,0,0.3);
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        /* ===== HEADER ===== */
        .demo-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 100;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: background 0.25s, border-color 0.25s;
        }

        .demo-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-width: 0;
        }

        .demo-badge {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .demo-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .demo-clock {
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            flex-shrink: 0;
        }

        .demo-header-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .demo-user-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 9px;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .demo-user-badge .user-role {
            font-size: 10px;
            background: var(--accent);
            color: #fff;
            border-radius: 10px;
            padding: 1px 5px;
            font-weight: 600;
        }

        #demo-refresh-hint {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .demo-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .demo-btn:hover { background: rgba(99,102,241,0.12); border-color: #6366f1; }
        .demo-btn.danger { border-color: rgba(239,68,68,0.4); color: #ef4444; }
        .demo-btn.danger:hover { background: rgba(239,68,68,0.12); }
        .demo-btn.icon-btn { padding: 4px 7px; }

        body.dark-theme .demo-btn.danger { color: #fca5a5; }

        /* Lang select */
        .demo-lang-select {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 5px;
            border-radius: 7px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }
        .demo-lang-select option { background: #1e293b; color: #f1f5f9; }

        /* ===== TOP STATS BAR ===== */
        /* ===== TOP STATS BAR =====
         * Layout (position: fixed, below header):
         *   [Total] [Online] [Offline]
         *   4 columns, fixed height (--topbar-h defined in :root above)
         */
        .demo-topbar {
            position: fixed;
            top: var(--header-h);
            left: 0; right: 0;
            height: var(--topbar-h);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            z-index: 90;
            transition: background 0.25s;
        }

        .topbar-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-right: 1px solid var(--border);
            min-width: 0;
        }
        .topbar-stat-icon { display: none; }
        .topbar-stat-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .topbar-stat-label {
            font-size: 9px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .topbar-stat-value {
            font-size: 22px; font-weight: 800;
            font-variant-numeric: tabular-nums; line-height: 1;
        }
        .topbar-stat-value.total   { color: var(--accent); }
        .topbar-stat-value.online  { color: var(--green); }
        .topbar-stat-value.offline { color: var(--red); }
        .topbar-stat-value.warning { color: var(--yellow); }

        /* Log cell in topbar */
        .topbar-log {
            display: flex; flex-direction: column;
            overflow: hidden;
            border-right: none;
        }
        .topbar-log-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px 12px 3px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar-log-title {
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-muted);
        }
        .topbar-log-live { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--green); }
        .demo-live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

        .topbar-log-list { flex: 1; overflow-y: auto; }
        .topbar-log-list::-webkit-scrollbar { width: 3px; }
        .topbar-log-list::-webkit-scrollbar-track { background: transparent; }
        .topbar-log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .log-entry {
            padding: 3px 12px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: baseline;
            gap: 7px;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-severity {
            font-size: 9px; font-weight: 700;
            padding: 1px 5px; border-radius: 3px;
            text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
        }
        .log-severity.critical { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .log-severity.error    { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .log-severity.warning  { background: rgba(245,158,11,0.2); color: #fcd34d; }
        .log-severity.info     { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .log-severity.debug    { background: rgba(148,163,184,0.1); color: #94a3b8; }
        .log-msg  { font-size: 12px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-time { font-size: 10px; color: var(--text-muted); font-family: monospace; flex-shrink: 0; }
        .log-empty { padding: 12px 10px; text-align: center; color: var(--text-muted); font-size: 11px; }

        /* ===== MAIN CONTENT (below header + topbar) ===== */
        .demo-main {
            position: fixed;
            top: calc(var(--header-h) + var(--topbar-h));
            left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: minmax(320px, var(--topology-panel-width, 50vw)) minmax(0, 1fr);
            --topology-panel-width: 50vw;
            transition: top 0.25s, grid-template-columns 0.22s ease;
        }
        .demo-main.topology-collapsed {
            grid-template-columns: 0 minmax(0, 1fr);
        }

        /* ===== LEFT: TOPOLOGY ===== */
        .demo-topology {
            position: relative;
            background: var(--bg);
            border-right: 1px solid var(--border);
            overflow: hidden;
            min-width: 0;
            transition: background 0.25s, opacity 0.18s, border-color 0.18s;
        }
        .demo-main.topology-collapsed .demo-topology {
            opacity: 0;
            pointer-events: none;
            border-right-color: transparent;
        }

        #demo-topo-svg { width: 100%; height: 100%; }

        .demo-topology-toggle {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: rgba(59,130,246,0.08);
            color: #bfdbfe;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .demo-topology-toggle:hover {
            background: rgba(37,99,235,0.28);
            border-color: rgba(96,165,250,0.62);
            color: #fff;
        }
        .demo-topology-resizer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 9px;
            z-index: 60;
            cursor: col-resize;
            background: transparent;
        }
        .demo-topology-resizer::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 3px;
            width: 3px;
            height: 54px;
            border-radius: 999px;
            background: rgba(148,163,184,0.42);
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.15s, background 0.15s;
        }
        .demo-topology-resizer:hover::after,
        body.topology-resizing .demo-topology-resizer::after {
            opacity: 1;
            background: rgba(59,130,246,0.82);
        }
        body.topology-resizing {
            cursor: col-resize;
            user-select: none;
        }
        body.topology-resizing * {
            user-select: none !important;
        }
        .demo-main.topology-collapsed .demo-topology-resizer {
            display: none;
        }

        .demo-topo-controls {
            position: absolute;
            right: 10px; bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .demo-topo-controls button {
            width: 30px; height: 30px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .demo-topo-controls button:hover { background: rgba(99,102,241,0.15); }
        .mon-view-btn.active { background: rgba(99,102,241,0.3) !important; border-color: #6366f1 !important; }
        .topo-mode-icon { width: 17px; height: 17px; display: block; fill: currentColor; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
        .topo-mode-icon.tree { fill: none; stroke-linecap: round; }
        .link-label { font-size: 10px; fill: #10b981; pointer-events: none; }

        /* Topology nodes/links */
        .topology-node { cursor: default; }
        .topology-node circle { transition: r 0.15s; }
        .topology-node.offline circle { opacity: 0.45; }
        .topology-node text { pointer-events: none; font-size: 11px; fill: var(--text); }
        .topology-node.collapsed { cursor: pointer; }
        .topology-node.has-hidden-alert .tree-collapse-badge {
            fill: rgba(239, 68, 68, 0.95);
            stroke: rgba(15, 23, 42, 0.9);
        }
        .topology-node.has-hidden-alert .tree-collapse-ring {
            fill: none;
            stroke: #ef4444;
            stroke-width: 4px;
            animation: mon-tree-alert-breath 1.6s ease-in-out infinite;
        }
        .topology-node.has-hidden-alert .tree-collapse-dot {
            fill: #ef4444;
            animation: mon-tree-alert-dot 1.6s ease-in-out infinite;
        }
        @keyframes mon-tree-alert-breath {
            0%, 100% { opacity: 0.3; stroke-width: 3px; }
            50% { opacity: 0.95; stroke-width: 6px; }
        }
        @keyframes mon-tree-alert-dot {
            0%, 100% { opacity: 0.55; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .topology-link { stroke-opacity: 0.7; }
        .topology-link.lldp    { stroke: var(--green);  stroke-dasharray: 10 5; animation: link-flow 1s linear infinite; }
        .topology-link.auto    { stroke: var(--green);  stroke-dasharray: 10 5; animation: link-flow 1s linear infinite; }
        .topology-link.manual  { stroke: var(--yellow); stroke-dasharray: 10 5; animation: link-flow 1.2s linear infinite; }
        .topology-link.unknown { stroke: #64748b; stroke-dasharray: 4 4; }
        .topology-link.snmp-flow { stroke: #ef4444; stroke-dasharray: 10 5; animation: link-flow 1s linear infinite; }
        .topology-link.ping-flow { stroke: #3b82f6; stroke-dasharray: 10 5; animation: link-flow 1s linear infinite; }
        @keyframes link-flow { to { stroke-dashoffset: -20; } }
        .link-label { font-size: 10px; fill: var(--green); pointer-events: none; }

        /* Legend */
        .demo-legend {
            position: absolute;
            bottom: 10px; left: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 7px;
            box-shadow: var(--shadow);
            transition: background 0.25s;
        }
        .demo-legend-toggle {
            background: none; border: none;
            color: var(--text-muted);
            cursor: pointer; font-size: 10px;
            padding: 2px 4px; display: block;
            transition: transform 0.2s;
        }
        .demo-legend.collapsed .demo-legend-toggle { transform: rotate(0deg); }
        .demo-legend:not(.collapsed) .demo-legend-toggle { transform: rotate(90deg); margin-bottom: 4px; }
        .demo-legend-body { display: flex; flex-direction: column; gap: 4px; }
        .demo-legend.collapsed .demo-legend-body { display: none; }
        .demo-legend-item {
            display: flex; align-items: center;
            gap: 6px; font-size: 10px;
            color: var(--text-muted); white-space: nowrap;
        }
        .demo-legend-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .demo-legend-line { width: 14px; height: 2px; flex-shrink: 0; }

        /* Tooltip */
        .demo-tooltip {
            position: absolute;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12px;
            color: var(--text);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.15s;
            max-width: 200px;
            line-height: 1.6;
            box-shadow: var(--shadow);
        }
        .demo-tooltip.visible { opacity: 1; }
        .demo-tooltip h4 { font-size: 12px; margin-bottom: 3px; }
        .demo-tooltip .st-online  { color: var(--green); }
        .demo-tooltip .st-offline { color: var(--red); }

        /* Loading */
        .demo-loading {
            position: absolute; inset: 0;
            background: rgba(15,23,42,0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 10; font-size: 13px;
            color: var(--text-muted); gap: 10px;
        }
        .spin {
            width: 18px; height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== RIGHT: SIDE PANEL ===== */
        .demo-cam-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            overflow: hidden;
        }

        .demo-cam-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 10px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .demo-cam-panel-title { display: none; }
        .demo-cam-panel-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .demo-cam-panel-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .demo-cam-panel-controls[hidden],
        .demo-side-tab[hidden],
        .cam-layout-btn[hidden] {
            display: none !important;
        }
        .demo-side-tab {
            appearance: none;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: all 0.15s;
        }
        .demo-side-tab:hover {
            border-color: rgba(59,130,246,0.35);
            color: var(--text);
            background: rgba(59,130,246,0.08);
        }
        .demo-side-tab.active {
            background: rgba(59,130,246,0.16);
            border-color: rgba(59,130,246,0.42);
            color: #93c5fd;
        }
        .demo-side-view {
            display: none;
            flex: 1;
            min-height: 0;
        }
        .demo-side-view.active {
            display: flex;
            flex-direction: column;
        }
        .demo-side-log-wrap {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 6px;
        }
        .demo-side-log-list {
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.42);
        }
        .demo-side-log-list::-webkit-scrollbar { width: 6px; }
        .demo-side-log-list::-webkit-scrollbar-track { background: transparent; }
        .demo-side-log-list::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.28); border-radius: 999px; }
        .demo-side-log-list .log-entry {
            padding: 9px 12px;
            align-items: flex-start;
        }
        .demo-side-log-list .log-msg {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            line-height: 1.45;
        }
        .demo-side-log-list .log-time {
            margin-top: 2px;
        }

        /* Made by YTSworks */
        /* YTS工作室製作 */
        .demo-iot-wrap {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 6px;
        }
        .demo-iot-list {
            height: 100%;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 260px));
            justify-content: start;
            align-content: start;
            gap: 10px;
        }
        .demo-iot-card {
            width: 100%;
            max-width: 260px;
            min-height: 132px;
            background: rgba(15, 23, 42, 0.42);
            border: 1px solid var(--border);
            border-left: 3px solid var(--green);
            border-radius: 8px;
            padding: 10px;
            min-width: 0;
        }
        .demo-iot-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 6px;
        }
        .demo-iot-name {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        .demo-iot-protocol {
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.3;
            margin-top: 1px;
        }
        .demo-iot-card.iot-online {
            border-left-color: var(--green);
        }
        .demo-iot-card.iot-offline {
            border-left-color: #ef4444;
        }
        .demo-iot-card.iot-error {
            border-left-color: #f97316;
        }
        .demo-iot-badge {
            border: 1px solid rgba(16,185,129,0.38);
            color: #86efac;
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 9px;
            font-weight: 700;
            white-space: nowrap;
        }
        .demo-iot-badge.iot-online {
            border-color: rgba(16,185,129,0.42);
            color: #86efac;
            background: rgba(16,185,129,0.10);
        }
        .demo-iot-badge.iot-offline {
            border-color: rgba(239,68,68,0.48);
            color: #fecaca;
            background: rgba(239,68,68,0.14);
        }
        .demo-iot-badge.iot-error {
            border-color: rgba(249,115,22,0.50);
            color: #fed7aa;
            background: rgba(249,115,22,0.14);
        }
        .demo-iot-readings {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
        }
        .demo-iot-reading {
            background: rgba(2, 6, 23, 0.26);
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 6px;
            padding: 5px 6px;
            min-width: 0;
        }
        .demo-iot-reading-label {
            color: var(--text-muted);
            font-size: 9px;
            line-height: 1.2;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        .demo-iot-reading-value {
            font-size: 17px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            margin-top: 2px;
            overflow-wrap: anywhere;
        }
        .demo-iot-reading-unit {
            color: var(--text-muted);
            font-size: 9px;

        .notif-action-link {

        .notif-empty { text-align: center; color: var(--text-muted); padding: 24px 14px; font-size: 12px; }

            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 10px 12px; border-bottom: 1px solid var(--border); gap: 7px; transition: background 0.15s;

        .notif-sev-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
        .notif-sev-warning .notif-sev-dot { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }
        .notif-sev-info    .notif-sev-dot { background: #3b82f6; box-shadow: 0 0 5px #3b82f6; }

        .notif-item-body { min-width: 0; }

        .notif-item-msg { font-size: 11px; color: var(--text-muted); margin-top: 2px; word-break: break-word; }
        .notif-item-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .notif-item-actions { display: flex; gap: 3px; flex-shrink: 0; }
        .notif-item-btn {

        #notif-toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 99999;

        .notif-toast-warning{border-left-color:#f59e0b} .notif-toast-error{border-left-color:#ef4444} .notif-toast-info{border-left-color:#3b82f6}
        .notif-toast-header { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
        .notif-toast-header strong { flex: 1; color: var(--text); font-size: 12px; }
        .notif-toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 0; line-height: 1; }
        .notif-toast-msg { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .notif-toast-footer { text-align: right; }
        .notif-toast-ack {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444; font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; transition: background 0.15s;
        }
        .notif-toast-ack:hover { background: rgba(239,68,68,0.22); }

        @media (max-width: 900px) {

            .demo-topology {
                width: var(--topology-panel-width);
            }

            .demo-topology-resizer {
                display: none;
            }

            .demo-topo-controls {

            .demo-legend {
                left: 10px;

                max-width: none;
            }

            .demo-cam-panel-header {
                gap: 6px;

                overflow-x: auto;

            .demo-cam-panel-tabs::-webkit-scrollbar {
                display: none;
            }

            .demo-side-tab,

            .demo-cam-panel-controls {
                overflow-x: auto;

// ===== TOKEN + cache-bust strip =====
(function() {
    const p = new URLSearchParams(window.location.search);
    const t = p.get('token');
    if (t) sessionStorage.setItem('nms_token', t);
    if (p.has('token') || p.has('_cb')) {
        window.history.replaceState({}, '', window.location.pathname);
    }
})();
function getToken() { return sessionStorage.getItem('nms_token'); }

// ===== API =====
async function demoApi(path) {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/v1' + path, { headers });
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Unauthorized'); }
    return res.json();
}

// API helpers used by notifications.js
async function apiGet(path) { return demoApi(path); }
async function apiPut(path, body) {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/v1' + path, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Unauthorized'); }
    return res.json();
}
async function apiDelete(path) {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/v1' + path, { method: 'DELETE', headers });
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Unauthorized'); }
    return res.json();
}

// escapeHtmlNotif alias (used by notifications.js)
function escapeHtmlNotif(text) {
    if (!text) return '';
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

        error: currentLang === 'zh-TW' ? '\u932f\u8aa4' : 'Error'
    };
    return (DEMO_STRINGS[currentLang] || DEMO_STRINGS['zh-TW'])[key] || fallback[key] || key;
}

function getRoleLabel(role) {
    const map = { admin:'role_admin', editor:'role_editor', viewer:'role_viewer' };
    return di(map[role] || 'role_viewer');
}

function renderUserBadge() {
    try {
        const userStr = sessionStorage.getItem('nms_user');
        if (!userStr) return;
        const user = JSON.parse(userStr);
        const name = user.username || user.name || '';
        const role = user.role || 'viewer';
        if (!name) return;
        const badge = document.getElementById('demo-user-badge');
        const nameEl = document.getElementById('demo-user-name');
        const roleEl = document.getElementById('demo-user-role');
        if (badge && nameEl && roleEl) {
            nameEl.textContent = name;
            roleEl.textContent = getRoleLabel(role);
            badge.style.display = 'flex';
        }
    } catch(e) {}
}

function applyDemoI18n() {
    document.querySelectorAll('[data-di]').forEach(el => {
        el.textContent = di(el.dataset.di);
    });
    document.querySelectorAll('[data-title-di]').forEach(el => {
        el.setAttribute('title', di(el.dataset.titleDi));
        el.setAttribute('aria-label', di(el.dataset.titleDi));
    });
    monSyncTopologyToggleLabel();
    document.title = di('title_suffix');
    const badge = document.querySelector('.demo-badge');
    if (badge) badge.textContent = di('badge');
    const sel = document.getElementById('demo-lang-select');
    if (sel) sel.value = currentLang;
    document.documentElement.lang = currentLang;
    const sysNameEl = document.getElementById('demo-sys-name');
    if (sysNameEl && sysNameEl.dataset.sysName) {
        sysNameEl.textContent = sysNameEl.dataset.sysName + ' ' + di('title_suffix');
    }
    renderUserBadge();
    monUpdateSidePanel();
    if (monCameraLicensed && monActivePanel === 'cameras' && monCameras.length === 0) {
        monRenderCameraPlaceholder(monGetCameraEmptyMessage());
    }
    updateClock();

let demoSvg = null, demoG = null, demoZoomBeh = null, demoSim = null;
let demoCurrentTransform = null;
const MON_TOPOLOGY_WIDTH_KEY = 'monitor_topology_panel_width';
const MON_TOPOLOGY_COLLAPSED_KEY = 'monitor_topology_panel_collapsed';
let monTopologyCollapsed = false;
let monTopologyRerenderTimer = null;

function monStopTopologySimulation() {
    if (demoSim && typeof demoSim.stop === 'function') demoSim.stop();
    demoSim = null;
}

function monClampTopologyWidth(value) {
    const main = document.querySelector('.demo-main');
    const total = (main && main.clientWidth) || window.innerWidth || 1200;
    const raw = Number(value) || total * 0.5;
    if (total <= 900) {
        const mobileMax = Math.max(260, Math.min(460, total - 24));
        const mobileMin = Math.min(280, mobileMax);
        return Math.round(Math.max(mobileMin, Math.min(raw, mobileMax)));
    }
    const min = 320;
    const max = Math.max(min, Math.min(1120, total * 0.76, total - 360));
    return Math.round(Math.max(min, Math.min(raw, max)));
}

function monSetTopologyPanelWidth(width, persist) {
    const main = document.querySelector('.demo-main');
    if (!main) return;
    const nextWidth = monClampTopologyWidth(width);
    main.style.setProperty('--topology-panel-width', nextWidth + 'px');
    if (persist) {
        try { localStorage.setItem(MON_TOPOLOGY_WIDTH_KEY, String(nextWidth)); } catch(e) {}
    }
}

function monRenderTopologyFromCache() {
    if (monTopologyCollapsed) return;
    if (monCurrentView === 'tree') renderTreeTopoDemo(_cachedTopoNodes || [], _cachedTopoLinks || []);
    else renderTopoDemo(_cachedTopoNodes || [], _cachedTopoLinks || []);
}

function monScheduleTopologyRerender(delay) {
    if (monTopologyCollapsed) return;
    clearTimeout(monTopologyRerenderTimer);
    monTopologyRerenderTimer = setTimeout(monRenderTopologyFromCache, delay == null ? 160 : delay);
}

function monSyncTopologyToggleLabel() {
    const btn = document.getElementById('mon-topology-toggle');
    if (!btn) return;
    const key = monTopologyCollapsed ? 'show_topology' : 'hide_topology';
    btn.dataset.titleDi = key;
    btn.setAttribute('title', di(key));
    btn.setAttribute('aria-label', di(key));
    btn.innerHTML = monTopologyCollapsed ? '&#8250;' : '&#8249;';
}

function monApplyTopologyPaneState() {
    const main = document.querySelector('.demo-main');
    if (!main) return;
    main.classList.toggle('topology-collapsed', monTopologyCollapsed);
    monSyncTopologyToggleLabel();
    if (monTopologyCollapsed) {
        monStopTopologySimulation();
        hideDemoTooltip();
    } else {
        monScheduleTopologyRerender(260);
    }
}

function monToggleTopologyPane() {
    monTopologyCollapsed = !monTopologyCollapsed;
    try { localStorage.setItem(MON_TOPOLOGY_COLLAPSED_KEY, monTopologyCollapsed ? '1' : '0'); } catch(e) {}
    monApplyTopologyPaneState();
}
window.monToggleTopologyPane = monToggleTopologyPane;

function monInitTopologyPane() {
    const main = document.querySelector('.demo-main');
    const resizer = document.getElementById('mon-topology-resizer');
    if (!main) return;
    let savedWidth = null;
    try { savedWidth = parseInt(localStorage.getItem(MON_TOPOLOGY_WIDTH_KEY), 10); } catch(e) {}
    monSetTopologyPanelWidth(savedWidth || ((window.innerWidth || 1200) * 0.5), false);
    try { monTopologyCollapsed = localStorage.getItem(MON_TOPOLOGY_COLLAPSED_KEY) === '1'; } catch(e) {}
    monApplyTopologyPaneState();

    if (resizer) {
        resizer.addEventListener('pointerdown', (event) => {
            if (monTopologyCollapsed) return;
            event.preventDefault();
            document.body.classList.add('topology-resizing');
            const mainRect = main.getBoundingClientRect();
            const onMove = (moveEvent) => {
                monSetTopologyPanelWidth(moveEvent.clientX - mainRect.left, true);
                monScheduleTopologyRerender(180);
            };
            const onUp = () => {
                document.body.classList.remove('topology-resizing');
                window.removeEventListener('pointermove', onMove);
                monScheduleTopologyRerender(20);
            };
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp, { once: true });
        });
    }

    window.addEventListener('resize', () => {
        let current = null;
        try { current = parseInt(localStorage.getItem(MON_TOPOLOGY_WIDTH_KEY), 10); } catch(e) {}
        monSetTopologyPanelWidth(current || ((window.innerWidth || 1200) * 0.5), false);
        monScheduleTopologyRerender(220);
    });
}

function fmtTraffic(bps) {
    if (!bps) return '0';
    if (bps >= 1e12) return (bps/1e12).toFixed(0)+'T';
    if (bps >= 1e9)  return (bps/1e9).toFixed(0)+'G';
    if (bps >= 1e6)  return (bps/1e6).toFixed(0)+'M';
    if (bps >= 1e3)  return (bps/1e3).toFixed(0)+'K';
    return String(bps);
}

const NODE_COLORS = {
    router:'#6366f1', switch:'#10b981', firewall:'#ef4444',
    server:'#3b82f6', ipcam:'#f59e0b', video_wall:'#8b5cf6',
    access_point:'#8b5cf6', codec:'#ec4899', other:'#6b7280'
};
function getColor(t) { return NODE_COLORS[t] || NODE_COLORS.other; }

function renderTopoDemo(nodes, links) {
    const wrap = document.getElementById('demo-topology-wrap');
    const container = document.getElementById('demo-topo-svg');
    if (monTopologyCollapsed) {
        monStopTopologySimulation();
        if (container) container.innerHTML = '';
        return;
    }
    monStopTopologySimulation();
    container.innerHTML = '';

    const width  = wrap.clientWidth;
    const height = wrap.clientHeight;

    demoSvg = d3.select('#demo-topo-svg').append('svg')
        .attr('width','100%').attr('height','100%');

    demoSvg.append('defs').append('marker')
        .attr('id','demo-arrow').attr('viewBox','-0 -5 10 10')
        .attr('refX',40).attr('refY',0).attr('orient','auto')
        .attr('markerWidth',6).attr('markerHeight',6)
        .append('path').attr('d','M 0,-5 L 10,0 L 0,5')
        .attr('fill','#64748b');

    demoG = demoSvg.append('g');

    demoZoomBeh = d3.zoom().scaleExtent([0.1, 5])
        .on('zoom', (e) => {
            demoCurrentTransform = e.transform;
            demoG.attr('transform', e.transform);
        });
    demoSvg.call(demoZoomBeh);
    if (demoCurrentTransform) {
        demoSvg.call(demoZoomBeh.transform, demoCurrentTransform);
    }

    if (!nodes || nodes.length === 0) {
        demoG.append('text').attr('x', width/2).attr('y', height/2)
            .attr('text-anchor','middle').attr('fill','#94a3b8')
            .text(di('topology_empty'));
        return;
    }

    const d3Nodes = nodes.map(n => ({
        ...n,
        x: n.x || (width/2  + (Math.random()-0.5)*200),
        y: n.y || (height/2 + (Math.random()-0.5)*200),
        fx: (n.x && n.x !== 0) ? n.x : null,
        fy: (n.y && n.y !== 0) ? n.y : null,
    }));

    const nodeMap = new Map(d3Nodes.map(n => [n.id, n]));
    const d3Links = (links || [])
        .filter(l => nodeMap.has(l.source) && nodeMap.has(l.target))
        .map(l => ({ ...l, source: nodeMap.get(l.source), target: nodeMap.get(l.target) }));

    demoSim = d3.forceSimulation(d3Nodes)
        .force('link',      d3.forceLink(d3Links).id(d=>d.id).distance(180))
        .force('charge',    d3.forceManyBody().strength(-700))
        .force('center',    d3.forceCenter(width/2, height/2))
        .force('collision', d3.forceCollide().radius(70));

    const linkSel = demoG.append('g').selectAll('line')
        .data(d3Links).join('line')
        .attr('class', d => {
            const isSnmp = (d.source.snmp_version > 0 && d.target.snmp_version > 0);
            const flowCls = isSnmp ? 'snmp-flow' : 'ping-flow';
            return 'topology-link ' + (d.link_type || 'unknown') + ' ' + flowCls;
        })
        .attr('stroke-width', 2)
        .attr('marker-end', 'url(#demo-arrow)');

    const trafficLinks = d3Links.filter(l =>
        l.source_if_id || l.target_if_id ||
        (l.bandwidth_in||0)+(l.bandwidth_out||0) > 0
    );

    const linkLabelSel = demoG.append('g').selectAll('text')
        .data(trafficLinks).join('text')
        .attr('class','link-label')
        .text(l => {
            const bwIn  = (l.bandwidth_in  || 0) * 8;
            const bwOut = (l.bandwidth_out || 0) * 8;
            if (bwIn > 0 || bwOut > 0) return `\u2193 ${fmtTraffic(bwIn)} \u2191 ${fmtTraffic(bwOut)}`;
            if (l.link_speed > 0) return fmtTraffic(l.link_speed);
            return '';
        });

    const nodeSel = demoG.append('g').selectAll('g')
        .data(d3Nodes).join('g')
        .attr('class', d => 'topology-node' + (d.is_online ? '' : ' offline'))
        .call(d3.drag()
            .on('start', (e,d) => { if (!e.active) demoSim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
            .on('end',   (e,d) => { if (!e.active) demoSim.alphaTarget(0); d.fx=d.x; d.fy=d.y; })
        )
        .on('mouseover', showDemoTooltip)
        .on('mousemove', moveDemoTooltip)
        .on('mouseout',  hideDemoTooltip);

    nodeSel.append('circle').attr('r',28)
        .attr('fill', d=>getColor(d.device_type)).attr('fill-opacity',0.2)
        .attr('stroke',d=>getColor(d.device_type)).attr('stroke-width',2);

    nodeSel.append('circle').attr('r',20)
        .attr('fill',d=>getColor(d.device_type)).attr('fill-opacity',0.85);

    const ICONS = { router:'R', switch:'S', firewall:'F', server:'SV', ipcam:'C', video_wall:'VW', access_point:'AP', codec:'CD', other:'?' };
    nodeSel.append('text').attr('text-anchor','middle').attr('dy','0.35em')
        .attr('font-size','14px').attr('fill','#fff').attr('pointer-events','none')
        .text(d => ICONS[d.device_type] || ICONS.other);

    nodeSel.append('text').attr('text-anchor','middle').attr('dy','2.8em')
        .attr('font-size','11px').attr('fill','var(--text-muted)').attr('pointer-events','none')
        .text(d => getNodeDisplayName(d));

    nodeSel.filter(d => !d.is_online).append('circle')
        .attr('class','offline-dot').attr('r',7).attr('cx',18).attr('cy',-18)
        .attr('fill','#ef4444').attr('stroke','#0f172a').attr('stroke-width',2);

    demoSim.on('tick', () => {
        linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
               .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        linkLabelSel
            .attr('x',d=>(d.source.x+d.target.x)/2)
            .attr('y',d=>(d.source.y+d.target.y)/2-6);
        nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

let monTreeCollapsedNodes = (function() {
    try {
        const saved = localStorage.getItem('monitor_tree_collapsed_nodes');
        const parsed = saved ? JSON.parse(saved) : [];
        const normalized = new Set();
        (parsed || []).forEach(v => {
            normalized.add(v);
            normalized.add(String(v));
            const n = Number(v);
            if (!Number.isNaN(n)) normalized.add(n);
        });
        return normalized;
    } catch (e) {
        return new Set();
    }
})();

    try {
        const keys = [...monTreeCollapsedNodes].map(v => String(v));
        localStorage.setItem('monitor_tree_collapsed_nodes', JSON.stringify([...new Set(keys)]));
    } catch (e) {}
}

function monToggleTreeNodeCollapse(nodeId) {
    const numericId = Number(nodeId);
    const hasNode = monTreeCollapsedNodes.has(nodeId)
        || monTreeCollapsedNodes.has(String(nodeId))
        || (!Number.isNaN(numericId) && monTreeCollapsedNodes.has(numericId));
    if (hasNode) {
        monTreeCollapsedNodes.delete(nodeId);
        monTreeCollapsedNodes.delete(String(nodeId));
        if (!Number.isNaN(numericId)) monTreeCollapsedNodes.delete(numericId);
    } else {
        monTreeCollapsedNodes.add(nodeId);
        monTreeCollapsedNodes.add(String(nodeId));
        if (!Number.isNaN(numericId)) monTreeCollapsedNodes.add(numericId);
    }
    monSaveTreeCollapsedNodes();

let _cachedTopoNodes = [];
let _cachedTopoLinks = [];

async function refreshTopoStatus() {
    if (!demoSvg) return;
    try {
        const res = await demoApi('/topology');
        if (!res.success) return;

        const newNodes = res.data.nodes || [];
        const newLinks = res.data.links || [];
        _cachedTopoNodes = newNodes;
        _cachedTopoLinks = newLinks;

        const newNodeIds = newNodes.map(n=>n.id).sort().join(',');
        const newLinkIds = newLinks.map(l=>l.id).sort().join(',');
        if (monTopologyCollapsed) {
            _lastNodeIds = newNodeIds;
            _lastLinkIds = newLinkIds;
            return;
        }
        if (newNodeIds !== _lastNodeIds || newLinkIds !== _lastLinkIds) {
            _lastNodeIds = newNodeIds;
            _lastLinkIds = newLinkIds;
            if (monCurrentView === 'tree') renderTreeTopoDemo(newNodes, newLinks);
            else renderTopoDemo(newNodes, newLinks);
            return;
        }

        if (monCurrentView === 'tree') {
            renderTreeTopoDemo(newNodes, newLinks);
        } else {
            const statusMap = new Map(newNodes.map(n=>[n.id, n.is_online]));
            demoSvg.selectAll('.topology-node').each(function(d) {
                const online = statusMap.get(d.id);
                if (online === undefined) return;
                d.is_online = online;
                const el = d3.select(this);
                el.classed('offline', !online);
                el.select('.offline-dot').remove();
                if (!online) {
                    el.append('circle').attr('class','offline-dot')
                        .attr('r',7).attr('cx',18).attr('cy',-18)
                        .attr('fill','#ef4444').attr('stroke','#0f172a').attr('stroke-width',2);
                }
            });

            const linkMap = new Map(newLinks.map(l=>[l.id, l]));
            demoSvg.selectAll('.link-label').each(function(d) {
                if (!d || !d.id) return;
                const link = linkMap.get(d.id);
                if (!link) return;
                d.bandwidth_in  = link.bandwidth_in;
                d.bandwidth_out = link.bandwidth_out;
                const bpsIn  = (link.bandwidth_in  || 0) * 8;
                const bpsOut = (link.bandwidth_out || 0) * 8;
                d3.select(this).text(`\u2193 ${fmtTraffic(bpsIn)} \u2191 ${fmtTraffic(bpsOut)}`);
            });
        }
    } catch(e) { console.warn('[Demo] refreshTopoStatus error', e); }
}

// ===== Side panel tabs (monitor.html) =====
function renderTreeTopoDemo(nodes, links) {
    const container = document.getElementById('demo-topo-svg');
    if (monTopologyCollapsed) {
        monStopTopologySimulation();
        if (container) container.innerHTML = '';
        return;
    }
    monStopTopologySimulation();
    container.innerHTML = '';
    const wrap = document.getElementById('demo-topology-wrap');
    const width = wrap.clientWidth || 800;
    const height = wrap.clientHeight || 600;

    demoSvg = d3.select('#demo-topo-svg').append('svg').attr('width', '100%').attr('height', '100%');
    demoG = demoSvg.append('g');
    demoZoomBeh = d3.zoom().scaleExtent([0.1, 5])
        .on('zoom', (e) => {
            demoCurrentTransform = e.transform;
            demoG.attr('transform', e.transform);
        });
    demoSvg.call(demoZoomBeh);
    if (demoCurrentTransform) demoSvg.call(demoZoomBeh.transform, demoCurrentTransform);

    if (!nodes || nodes.length === 0) {
        demoG.append('text')
            .attr('x', width / 2)
            .attr('y', height / 2)
            .attr('text-anchor', 'middle')
            .attr('fill', '#94a3b8')
            .text(di('topology_empty'));
        return;
    }

    let rootNode = nodes.find(n => n.device_type === 'router') || nodes.find(n => n.device_type === 'firewall');
    if (!rootNode) {
        const inDeg = {};
        nodes.forEach(n => { inDeg[n.id] = 0; });
        links.forEach(l => {
            const targetId = typeof l.target === 'object' ? l.target.id : l.target;
            if (inDeg[targetId] !== undefined) inDeg[targetId]++;
        });
        rootNode = nodes.reduce((a, b) => (inDeg[a.id] <= inDeg[b.id] ? a : b));
    }

    const nodeMap = new Map(nodes.map(n => [n.id, { ...n, children: [] }]));
    const visited = new Set([rootNode.id]);
    const queue = [rootNode.id];
    const adj = new Map();
    nodes.forEach(n => adj.set(n.id, []));
    links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        if (adj.has(s)) adj.get(s).push(t);
        if (adj.has(t)) adj.get(t).push(s);
    });
    while (queue.length) {
        const cur = queue.shift();
        (adj.get(cur) || []).forEach(nid => {
            if (!visited.has(nid) && nodeMap.has(nid)) {
                visited.add(nid);
                nodeMap.get(cur).children.push(nodeMap.get(nid));
                queue.push(nid);
            }
        });
    }
    nodes.forEach(n => {
        if (!visited.has(n.id)) nodeMap.get(rootNode.id).children.push(nodeMap.get(n.id));
    });

    const linkDataMap = new Map();
    links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        linkDataMap.set(`${s}-${t}`, l);
        linkDataMap.set(`${t}-${s}`, l);
    });
    function getLd(d) {
        return linkDataMap.get(`${d.source.data.id}-${d.target.data.id}`) ||
            linkDataMap.get(`${d.target.data.id}-${d.source.data.id}`) || null;
    }
    function countHiddenOffline(node) {
        if (!monTreeCollapsedNodes.has(node.id)) return 0;
        let count = 0;
        const walk = (children) => {
            (children || []).forEach(child => {
                if (!child.is_online) count++;
                walk(child.children);
            });
        };
        walk(node.children);
        return count;
    }

    const root = d3.hierarchy(nodeMap.get(rootNode.id), d => {
        if (monTreeCollapsedNodes.has(d.id)) return null;
        return d.children;
    });
    d3.tree().size([width - 120, height - 120])(root);

    const lgp = demoG.append('g').selectAll('g.mon-tree-link-grp')
        .data(root.links()).join('g').attr('class', 'mon-tree-link-grp');

    lgp.append('path')
        .attr('fill', 'none')
        .attr('class', d => {
            const ld = getLd(d);
            const isSnmp = ld && (d.source.data.snmp_version > 0 && d.target.data.snmp_version > 0);
            return 'topology-link auto ' + (isSnmp ? 'snmp-flow' : 'ping-flow');
        })
        .attr('stroke-width', 1.5)
        .attr('d', d3.linkVertical().x(d => d.x + 60).y(d => d.y + 60));

    lgp.append('text')
        .attr('class', 'tree-link-label link-label')
        .attr('text-anchor', 'middle').attr('font-size', '10px').attr('dy', -4)
        .attr('transform', d => `translate(${((d.source.x + d.target.x) / 2) + 60},${((d.source.y + d.target.y) / 2) + 60})`)
        .attr('fill', d => {
            const ld = getLd(d);
            if (!ld) return '#94a3b8';
            return ((ld.bandwidth_in || 0) + (ld.bandwidth_out || 0) > 0 || ld.source_if_id || ld.target_if_id) ? '#10b981' : '#94a3b8';
        })
        .text(d => {
            const ld = getLd(d);
            if (!ld) return '';
            const bwIn = (ld.bandwidth_in || 0) * 8;
            const bwOut = (ld.bandwidth_out || 0) * 8;
            if (bwIn > 0 || bwOut > 0 || ld.source_if_id || ld.target_if_id) return `\u2193 ${fmtTraffic(bwIn)} \u2191 ${fmtTraffic(bwOut)}`;
            if (ld.link_speed > 0) return fmtTraffic(ld.link_speed);
            return '';
        });

    const descendants = root.descendants().map(d => {
        d.hiddenOfflineCount = countHiddenOffline(d.data);
        return d;
    });

    const nodeEl = demoG.append('g').selectAll('g')
        .data(descendants).join('g')
        .attr('class', d => {
            const cls = ['topology-node'];
            if (!d.data.is_online) cls.push('offline');
            if (monTreeCollapsedNodes.has(d.data.id)) cls.push('collapsed');
            if (d.hiddenOfflineCount > 0) cls.push('has-hidden-alert');
            return cls.join(' ');
        })
        .attr('transform', d => `translate(${d.x + 60},${d.y + 60})`)
        .on('click', (e, d) => {
            const hasChildren = Array.isArray(d.data.children) && d.data.children.length > 0;
            if (hasChildren || monTreeCollapsedNodes.has(d.data.id)) {
                e.stopPropagation();
                monToggleTreeNodeCollapse(d.data.id);
            }
        })
        .on('mouseover', (e, d) => showDemoTooltip(e, d.data))
        .on('mousemove', moveDemoTooltip)
        .on('mouseout', hideDemoTooltip);

    nodeEl.append('circle').attr('r', 28).attr('fill', d => getColor(d.data.device_type)).attr('fill-opacity', 0.2)
        .attr('stroke', d => getColor(d.data.device_type)).attr('stroke-width', 2);
    nodeEl.append('circle').attr('r', 20).attr('fill', d => getColor(d.data.device_type)).attr('fill-opacity', 0.85);

    const ICONS = { router: 'R', switch: 'S', firewall: 'F', server: 'SV', ipcam: 'C', video_wall: 'VW', access_point: 'AP', codec: 'CD', other: 'N' };
    nodeEl.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em').attr('font-size', '14px').attr('fill', '#fff').attr('pointer-events', 'none')
        .text(d => ICONS[d.data.device_type] || ICONS.other);
    nodeEl.append('text').attr('text-anchor', 'middle').attr('dy', '2.8em').attr('font-size', '11px').attr('fill', 'var(--text-muted)').attr('pointer-events', 'none')
        .text(d => getNodeDisplayName(d.data));

    nodeEl.filter(d => !d.data.is_online).append('circle')
        .attr('class', 'offline-dot').attr('r', 7).attr('cx', 18).attr('cy', -18)
        .attr('fill', '#ef4444').attr('stroke', '#0f172a').attr('stroke-width', 2);

    const collapsedNodeEl = nodeEl.filter(d => monTreeCollapsedNodes.has(d.data.id));
    collapsedNodeEl.append('circle')
        .attr('class', 'tree-collapse-badge')
        .attr('r', 10).attr('cx', 20).attr('cy', 20)
        .attr('fill', 'var(--accent)').attr('stroke', '#fff').attr('stroke-width', 1.2);
    collapsedNodeEl.append('text')
        .attr('x', 20).attr('y', 23.5)
        .attr('text-anchor', 'middle')
        .attr('fill', '#fff').attr('font-size', '12px').attr('font-weight', 'bold')
        .text('+');
    collapsedNodeEl.filter(d => d.hiddenOfflineCount > 0).append('circle')
        .attr('class', 'tree-collapse-ring')
        .attr('r', 34);
    collapsedNodeEl.filter(d => d.hiddenOfflineCount > 0).append('circle')
        .attr('class', 'tree-collapse-dot')
        .attr('r', 5).attr('cx', 24).attr('cy', -24);

    demoSim = null;
}

function sevClass(s) {
    if (!s) return 'info';
    const sl = s.toLowerCase();
    if (['critical','emergency','alert'].includes(sl)) return 'critical';
    if (sl==='error')   return 'error';
    if (sl==='warning') return 'warning';
    if (['info','notice'].includes(sl)) return 'info';
    return 'debug';
}

async function loadLogs() {
    try {
        const res = await demoApi('/events?limit=50');
        const markup = !res.success || !res.data || res.data.length === 0
            ? `<div class="log-empty">${di('no_events')}</div>`
            : res.data.map(e => {
                const sc = sevClass(e.severity);
                const ts = e.created_at ? new Date(e.created_at).toLocaleTimeString(currentLang || 'zh-TW',{hour12:false}) : '';
                return `<div class="log-entry">
                    <span class="log-severity ${sc}">${(e.severity||'INFO').toUpperCase()}</span>
                    <span class="log-msg">${escapeHtml(e.message||e.event_type||'-')}</span>
                    <span class="log-time">${ts}</span>
                </div>`;
            }).join('');
        const list = document.getElementById('demo-side-log-list');
        if (list) list.innerHTML = markup;

        console.warn('[Demo] events error', e);
        const markup = `<div class="log-empty">${di('no_events')}</div>`;
        const list = document.getElementById('demo-side-log-list');
        if (list) list.innerHTML = markup;
    }
}

// ===== IOT MONITOR =====
let monIoTDevices = [];
let monIoTLoaded = false;

function monIsIoTOnline(device) {
    return !!(device && device.last_seen && !device.last_error);
}

function monIoTUnit(metric) {
    const key = String(metric || '').toLowerCase();
    if (key.includes('temperature')) return 'C';
    if (key.includes('humidity')) return '%';
    if (key.includes('voltage')) return 'V';
    if (key.includes('current')) return 'A';
    if (key.includes('power')) return 'W';
    if (key.includes('co2')) return 'ppm';
    return '';
}

function monFormatIoTValue(value, unit) {
    const n = Number(value);
    if (!Number.isFinite(n)) return '-';
    return n.toFixed(unit === 'C' || unit === '%' ? 1 : 2);
}

function monFormatIoTTime(value) {
    if (!value) return '-';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleTimeString(currentLang || 'zh-TW', { hour12: false });
}

function monIoTReadings(device) {
    const readings = Array.isArray(device.last_readings) && device.last_readings.length
        ? device.last_readings
        : [{ metric: device.metric || 'value', value: device.last_value }];
    return readings.filter(r => r && r.value !== null && r.value !== undefined).map(r => {
        const unit = r.unit || monIoTUnit(r.metric);
        return `<div class="demo-iot-reading">
            <div class="demo-iot-reading-label">${escapeHtml(r.metric || 'value')}</div>
            <div class="demo-iot-reading-value">${monFormatIoTValue(r.value, unit)}${unit ? `<span class="demo-iot-reading-unit">${escapeHtml(unit)}</span>` : ''}</div>
        </div>`;
    }).join('');
}

function monRenderIoTDevices(devices) {
    const list = document.getElementById('demo-iot-list');
    if (!list) return;
    const visibleDevices = (devices || []).filter(device => device && device.enabled !== false);
    if (!visibleDevices.length) {
        list.innerHTML = `<div class="log-empty">${di('iot_no_online')}</div>`;
        return;
    }
    list.innerHTML = visibleDevices.map(device => {
        const readings = monIoTReadings(device) || `<div class="demo-iot-reading"><div class="demo-iot-reading-label">value</div><div class="demo-iot-reading-value">-</div></div>`;
        const protocol = String(device.protocol || '-').replace(/_/g, ' ').toUpperCase();
        const statusClass = device.last_error ? 'iot-error' : monIsIoTOnline(device) ? 'iot-online' : 'iot-offline';
        const status = device.last_error ? di('error') : monIsIoTOnline(device) ? di('online_s') : di('offline_s');
        return `<div class="demo-iot-card ${statusClass}">
            <div class="demo-iot-card-head">
                <div>
                    <div class="demo-iot-name">${escapeHtml(device.name || 'IoT Device')}</div>
                    <div class="demo-iot-protocol">${escapeHtml(protocol)} &middot; Unit ${escapeHtml(device.unit_id || 1)}</div>
                </div>
                <span class="demo-iot-badge ${statusClass}">${escapeHtml(status)}</span>
            </div>
            <div class="demo-iot-readings">${readings}</div>
            <div class="demo-iot-footer">${di('last_update')}: ${escapeHtml(monFormatIoTTime(device.last_seen))}</div>
        </div>`;
    }).join('');
}

async function monLoadIoTDevices() {
    try {
        const res = await demoApi('/iot/devices');
        monIoTDevices = res && res.success ? (res.data || []) : [];
        monIoTLoaded = true;
        monRenderIoTDevices(monIoTDevices);
    } catch(e) {
        console.warn('[Monitor] IoT load failed:', e);
        const list = document.getElementById('demo-iot-list');
        if (list) list.innerHTML = `<div class="log-empty">${di('iot_load_failed')}</div>`;
    }
}

// ===== CAMERA MONITOR =====
let monCameras = [];
let monLayout = 4;
let monFullscreenCellId = null;
let monActivePanel = 'logs';
let monCameraLicensed = false;
let monCameraPanelReady = false;
let monCameraMax = 0;
const MON_CAMERA_PREVIEW_TRANSPORT_KEY = 'nms-camera-preview-transport';

function monGetCameraPreviewTransport() {
    try {
        return String(localStorage.getItem(MON_CAMERA_PREVIEW_TRANSPORT_KEY) || 'mjpeg').toLowerCase();
    } catch (_) {
        return 'mjpeg';
    }
}

function monUseWebRTCPreview() {
    return monGetCameraPreviewTransport() === 'webrtc'
        && !!(window.CameraWebRTC && window.CameraWebRTC.supports && window.CameraWebRTC.supports());
}

function monAllowedLayouts() {
    const max = Math.max(0, parseInt(monCameraMax, 10) || 0);
    if (max > 9) return [4, 9, 16];
    if (max > 4) return [4, 9];
    if (max > 0) return [4];
    return [];
}

function monDefaultLayout() {
    const desired = monCameras.length > 9 ? 16 : monCameras.length > 4 ? 9 : 4;
    const allowed = monAllowedLayouts();
    if (allowed.length === 0) return 4;
    const maxAllowed = allowed[allowed.length - 1];
    return Math.min(desired, maxAllowed);
}

function monUpdateLayoutButtons() {
    const allowed = monAllowedLayouts();
    const visibleLayouts = new Set(allowed);
    if (allowed.length > 0 && !visibleLayouts.has(monLayout)) {
        monLayout = monDefaultLayout();
    }
    [4, 9, 16].forEach(n => {
        const btn = document.getElementById('cam-btn-' + n);
        if (!btn) return;
        const visible = visibleLayouts.has(n);
        btn.hidden = !visible;
        btn.disabled = !visible;
        btn.classList.toggle('active', visible && n === monLayout);
    });
}

function monGetCameraEmptyMessage() {
    return di('no_camera_feeds');
}

function monRenderCameraPlaceholder(message) {
    const grid = document.getElementById('demo-cam-grid');
    if (!grid) return;
    monExitFullscreen();
    grid.className = 'demo-cam-grid grid-4';
    grid.innerHTML =
        '<div class="cam-no-license" style="grid-column:1/-1;grid-row:1/-1;">' +
        '<div class="cam-no-icon">&#128249;</div>' +
        '<div class="cam-no-text">' + escapeHtml(message) + '</div></div>';
}

function monSetCameraTabVisible(visible) {
    const tab = document.getElementById('mon-tab-cameras');
    if (tab) tab.hidden = !visible;
    if (!visible && monActivePanel === 'cameras') monActivePanel = 'logs';
    monUpdateSidePanel();
}

function monUpdateSidePanel() {
    const showCameraPanel = monActivePanel === 'cameras' && monCameraLicensed;
    const showIoTPanel = monActivePanel === 'iot';
    const logsTab = document.getElementById('mon-tab-logs');
    const cameraTab = document.getElementById('mon-tab-cameras');
    const iotTab = document.getElementById('mon-tab-iot');
    const logsView = document.getElementById('demo-logs-view');
    const cameraView = document.getElementById('demo-cameras-view');
    const iotView = document.getElementById('demo-iot-view');
    const cameraControls = document.getElementById('demo-cam-controls');
    if (logsTab) logsTab.classList.toggle('active', !showCameraPanel && !showIoTPanel);
    if (cameraTab) cameraTab.classList.toggle('active', showCameraPanel);
    if (iotTab) iotTab.classList.toggle('active', showIoTPanel);
    if (logsView) logsView.classList.toggle('active', !showCameraPanel && !showIoTPanel);
    if (cameraView) cameraView.classList.toggle('active', showCameraPanel);
    if (iotView) iotView.classList.toggle('active', showIoTPanel);
    if (cameraControls) {
        cameraControls.hidden = !showCameraPanel;
        cameraControls.style.display = showCameraPanel ? 'flex' : 'none';
    }
    monUpdateLayoutButtons();
}

window.monShowPanel = async function(panel) {
    if (panel === 'cameras') monActivePanel = monCameraLicensed ? 'cameras' : 'logs';
    else if (panel === 'iot') monActivePanel = 'iot';
    else monActivePanel = 'logs';
    monUpdateSidePanel();
    if (monActivePanel === 'cameras' && !monCameraPanelReady) {
        await monInitCameras(true);
    }
    if (monActivePanel === 'iot' && !monIoTLoaded) {
        await monLoadIoTDevices();
    }
};

async function monRefreshCameraAvailability(refreshFeeds) {
    try {
        const statusRes = await demoApi('/cameras/status');
        monCameraLicensed = !!(statusRes && statusRes.success && statusRes.data && statusRes.data.licensed);
        monCameraMax = monCameraLicensed ? (parseInt(statusRes.data.max, 10) || 0) : 0;
        monSetCameraTabVisible(monCameraLicensed);
        if (!monCameraLicensed) {
            monCameras = [];
            monCameraPanelReady = false;
            monUpdateLayoutButtons();
            return;
        }
        if ((refreshFeeds && monActivePanel === 'cameras') || (monActivePanel === 'cameras' && !monCameraPanelReady)) {
            await monInitCameras(true);
        }
    } catch(e) {
        console.warn('[Monitor] camera license status failed:', e);
        monSetCameraTabVisible(monCameraLicensed);
    }
}

function monEnsureBackdrop() {
    let backdrop = document.getElementById('monitor-cam-backdrop');
    if (backdrop) return backdrop;
    backdrop = document.createElement('div');
    backdrop.id = 'monitor-cam-backdrop';
    backdrop.className = 'monitor-cam-backdrop';
    backdrop.hidden = true;
    backdrop.addEventListener('click', () => monExitFullscreen());
    document.body.appendChild(backdrop);
    return backdrop;
}

function monExitFullscreen() {
    if (monFullscreenCellId) {
        const cell = document.getElementById(monFullscreenCellId);
        if (cell) cell.classList.remove('monitor-inline-fullscreen');
    }
    const backdrop = document.getElementById('monitor-cam-backdrop');
    if (backdrop) backdrop.hidden = true;
    monFullscreenCellId = null;
}

window.monToggleFullscreen = function(idx) {
    const cell = document.getElementById('mon-cell-' + idx);
    if (!cell || cell.classList.contains('empty')) return;
    if (monFullscreenCellId === cell.id) {
        monExitFullscreen();
        return;
    }
    monExitFullscreen();
    monFullscreenCellId = cell.id;
    monEnsureBackdrop().hidden = false;
    cell.classList.add('monitor-inline-fullscreen');
};
async function monInitCamerasLegacy() {
    const grid = document.getElementById('demo-cam-grid');
    try {
        const statusRes = await demoApi('/cameras/status');
        if (!statusRes || !statusRes.success || !statusRes.data || !statusRes.data.licensed) {
            return;
        }

        const monitorRes = await demoApi('/cameras/monitor');

            ? monitorRes.data

        } else {

            monCameras = (camRes.data.cameras || camRes.data || []).filter(c => c.status === 'online' || c.is_enabled);

        monLayout = monDefaultLayout();

async function monInitCameras(forceReload) {
    if (!monCameraLicensed) {
        monCameraPanelReady = false;
        return;
    }
    if (monCameraPanelReady && !forceReload) {
        monRenderGrid();
        return;
    }

    try {
        const monitorRes = await demoApi('/cameras/monitor');
        const monitorList = monitorRes && monitorRes.success && Array.isArray(monitorRes.data)
            ? monitorRes.data
            : [];

        if (monitorList.length > 0) {
            monCameras = monitorList.filter(c => c.status === 'online' || c.monitor_display === 1);
        } else {
            const camRes = await demoApi('/cameras');
            if (!camRes || !camRes.success || !camRes.data) {
                monCameraPanelReady = false;
                return;
            }
            monCameras = (camRes.data.cameras || camRes.data || []).filter(c => c.status === 'online' || c.is_enabled);
        }

        if (monCameras.length === 0) {
            monCameraPanelReady = true;
            monUpdateLayoutButtons();
            monRenderCameraPlaceholder(monGetCameraEmptyMessage());
            return;
        }

        monLayout = monDefaultLayout();
        monUpdateLayoutButtons();

        monCameraPanelReady = true;
        monRenderGrid();
    } catch(e) {
        monCameraPanelReady = false;
        console.warn('[Monitor] camera init failed:', e);
    }
}

function monSetLayout(n) {
    if (!monAllowedLayouts().includes(n)) {
        monUpdateLayoutButtons();
        return;
    }
    monLayout = n;
    monUpdateLayoutButtons();
    monRenderGrid();
}

function monRenderGrid() {
    const grid = document.getElementById('demo-cam-grid');
    if (!grid) return;

    monExitFullscreen();
    if (window.CameraWebRTC && window.CameraWebRTC.stopAll) {
        window.CameraWebRTC.stopAll(grid);
    }
    // Stop existing MJPEG streams before replace
    grid.querySelectorAll('img[data-mjpeg]').forEach(img => { img.src = ''; });

    const token = getToken() || '';
    grid.className = 'demo-cam-grid grid-' + monLayout;

    const slots = monCameras.slice(0, monLayout);
    let html = '';

    for (let i = 0; i < monLayout; i++) {
        const cam = slots[i];
        if (cam) {
            const online   = cam.status === 'online';
            const dotCls   = online ? 'online' : '';
            const mjpegUrl = '/api/v1/cameras/' + cam.id + '/stream/mjpeg?token=' + encodeURIComponent(token);
            const snapBase = '/api/v1/cameras/' + cam.id + '/snapshot?token=' + encodeURIComponent(token);
            html += '<div class="demo-cam-cell" id="mon-cell-' + i + '" ondblclick="monToggleFullscreen(' + i + ')">' +
                '<div class="demo-cam-dot ' + dotCls + '"></div>' +
                '<button type="button" class="demo-cam-fs-btn" onclick="event.stopPropagation(); monToggleFullscreen(' + i + ')" title="' + di('fullscreen') + '">&#9974;</button>';
            if (monUseWebRTCPreview()) {
                html += '<video data-webrtc="1" id="mon-img-' + i + '"' +
                    ' data-cam-id="' + cam.id + '"' +
                    ' data-preview-mode="mse"' +
                    ' data-mjpeg-url="' + escapeHtml(mjpegUrl) + '"' +
                    ' data-snap-base="' + escapeHtml(snapBase) + '"' +
                    ' autoplay muted playsinline' +
                    ' style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
            } else {
                html += '<img data-mjpeg="1" id="mon-img-' + i + '"' +
                    ' src="' + mjpegUrl + '"' +
                    ' onerror="monImgFallback(this,\'' + snapBase + '\',' + cam.id + ')"' +
                    ' style="width:100%;height:100%;object-fit:contain;background:#000;">';
            }
            html += '<div class="demo-cam-cell-label">' + escapeHtml(cam.name || '') + '</div>' +
                '</div>';
        } else {
            html += '<div class="demo-cam-cell empty">-</div>';
        }
    }

    grid.innerHTML = html;
    grid.querySelectorAll('.demo-cam-cell.empty').forEach(cell => {
        cell.textContent = '-';
    });
    grid.querySelectorAll('.demo-cam-cell:not(.empty)').forEach((cell, idx) => {
        cell.ondblclick = () => monToggleFullscreen(idx);
        let btn = cell.querySelector('.demo-cam-fs-btn');
        if (!btn) {
            btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'demo-cam-fs-btn';
            cell.appendChild(btn);
        }
        btn.title = 'Fullscreen';
        btn.textContent = 'FS';
        btn.onclick = function(event) {
            event.stopPropagation();
            monToggleFullscreen(idx);
        };
    });
    grid.querySelectorAll('video[data-webrtc="1"]').forEach(video => {
        monStartWebRTC(video, video.dataset.camId);
    });
}

function monStartWebRTC(video, camId) {
    if (!video || !camId || !monUseWebRTCPreview()) {
        monReplaceWithMjpeg(video, camId);
        return;
    }
    video.style.opacity = '0.35';
    let fallbackDone = false;
    const fallback = (el) => {
        if (fallbackDone) return;
        fallbackDone = true;
        monReplaceWithMjpeg(el || video, camId);
    };
    const starter = window.CameraWebRTC.startLowLatency || window.CameraWebRTC.startMSE;
    starter(video, camId, {
        onReady: (el) => { el.style.opacity = '1'; },
        onError: (_reason, el) => fallback(el)
    }).catch(() => fallback(video));
}

function monMarkMSEPreviewUnavailable(video, camId) {
    monReplaceWithMjpeg(video, camId);
}

function monReplaceWithMjpeg(video, camId) {
    if (!video) return;
    if (window.CameraWebRTC && window.CameraWebRTC.stop) window.CameraWebRTC.stop(video);
    const img = document.createElement('img');
    img.id = video.id;
    img.setAttribute('data-mjpeg', '1');
    img.style.cssText = video.style.cssText || 'width:100%;height:100%;object-fit:contain;background:#000;';
    const mjpegUrl = video.dataset.mjpegUrl || ('/api/v1/cameras/' + camId + '/stream/mjpeg?token=' + encodeURIComponent(getToken() || ''));
    const snapBase = video.dataset.snapBase || ('/api/v1/cameras/' + camId + '/snapshot?token=' + encodeURIComponent(getToken() || ''));
    img.onerror = function() { monImgFallback(this, snapBase, camId); };
    img.src = mjpegUrl;
    video.replaceWith(img);
}

window.monImgFallback = function(img, baseSnap, camId) {
    if (img.dataset.fallback) return;
    img.dataset.fallback = '1';
    img.removeAttribute('data-mjpeg');
    img.src = baseSnap + '&t=' + Date.now();
    img.onerror = null;
    const cellId = img.closest('.demo-cam-cell') ? img.closest('.demo-cam-cell').id : null;
    const timer = setInterval(() => {
        if (!document.getElementById(cellId)) { clearInterval(timer); return; }
        img.src = baseSnap + '&t=' + Date.now();
    }, 5000);
};

function monRefreshCams() {
    if (!monCameraLicensed) return;
    monInitCameras(true);
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && monFullscreenCellId) monExitFullscreen();
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
    if (!getToken()) {
        window.location.href = window.location.pathname.startsWith('/static/') ? '/static/login.html' : '/login';
        return;
    }

    // Restore theme
    applyDemoTheme(localStorage.getItem('nms-theme') || 'dark');

    // Restore lang
    currentLang = localStorage.getItem('nms_lang') || 'zh-TW';
    if (!DEMO_STRINGS[currentLang]) currentLang = 'zh-TW';
    monInitTopologyPane();
    applyDemoI18n();

    renderUserBadge();

    // Legend default collapsed
    try {
        const collapsed = localStorage.getItem('demo_legend_collapsed');
        const legendEl = document.getElementById('demo-legend');
        if (collapsed === 'false') {
            legendEl.classList.remove('collapsed');
        }
    } catch(e) {}

    monUpdateSidePanel();
    await Promise.all([loadStats(), loadLogs(), loadTopoDemo(), monRefreshCameraAvailability(false)]);
    startAutoRefresh();
    initNotifications();
});
</script>
<script src="/static/js/config.js"></script>
<script>
writeConfiguredScripts([
    '/static/js/camera-webrtc.js',
    '/static/js/notifications.js'
]);
</script>
