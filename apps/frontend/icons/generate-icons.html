<!DOCTYPE html>
<html>
<head><title>Management Server Icon Generator</title></head>
<body>
<h2>Management Server PWA Icon Generator</h2>
<p>Right-click each icon below and "Save image as..." to save them. Or use the download buttons.</p>
<div id="icons"></div>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

function generateIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background ??rounded rect with gradient
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#6366f1');
    gradient.addColorStop(1, '#4f46e5');
    ctx.fillStyle = gradient;

    // Rounded rectangle
    const r = size * 0.15;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Signal icon (?“¡ style) ??3 arcs + dot
    const cx = size * 0.45;
    const cy = size * 0.55;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineCap = 'round';

    // Arcs
    const arcSizes = [size * 0.12, size * 0.2, size * 0.28];
    const lineWidths = [size * 0.03, size * 0.025, size * 0.02];
    arcSizes.forEach((arcR, i) => {
        ctx.lineWidth = lineWidths[i];
        ctx.beginPath();
        ctx.arc(cx, cy, arcR, -Math.PI * 0.75, -Math.PI * 0.05);
        ctx.stroke();
    });

    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.04, 0, Math.PI * 2);
    ctx.fill();

    // "NMS" text
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `bold ${size * 0.14}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('NMS', size * 0.65, size * 0.78);

    return canvas;
}

const container = document.getElementById('icons');
sizes.forEach(size => {
    const canvas = generateIcon(size);
    const div = document.createElement('div');
    div.style.cssText = 'display:inline-block;margin:10px;text-align:center;';

    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `icon-${size}x${size}.png`;
    link.textContent = `Download ${size}x${size}`;
    link.style.cssText = 'display:block;margin-top:5px;color:#6366f1;';

    div.appendChild(canvas);
    div.appendChild(link);
    container.appendChild(div);
});
</script>
</body>
</html>
