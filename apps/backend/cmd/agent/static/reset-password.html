<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="password_reset.title">重設密碼</title>
    <script src="/static/js/config.js"></script>
    <script>
        writeConfiguredStyles([
            '/static/css/main.css'
        ]);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.94);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.7);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--page-bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(14px);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.92rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
        }

        .hint {
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(59, 130, 246, 0.28);
        }

        .message {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.28);
        }

        .message.success {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.28);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand">
            <h1 data-i18n="app.title">管理系統</h1>
            <p data-i18n="password_reset.desc">請輸入新的密碼以完成重設。</p>
        </div>

        <div id="error" class="message error"></div>
        <div id="success" class="message success" data-i18n="password_reset.success">密碼已重設成功，正在返回登入頁...</div>

        <form id="reset-form">
            <div class="form-group">
                <label for="password" data-i18n="password_reset.new_password">新密碼</label>
                <input type="password" id="password" required minlength="8">
                <div class="hint" data-i18n="password_reset.error_requirements">密碼至少 8 個字，且需包含英文大小寫與數字或符號</div>
            </div>

            <div class="form-group">
                <label for="confirm-password" data-i18n="password_reset.confirm_password">確認新密碼</label>
                <input type="password" id="confirm-password" required minlength="8">
            </div>

            <button type="submit" class="btn" data-i18n="password_reset.reset_btn">更新密碼</button>
        </form>
    </div>

    <script>
        writeConfiguredScripts([
            '/static/js/i18n.js'
        ]);
    </script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        function showMessage(type, text) {
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            const target = type === 'success' ? successEl : errorEl;
            target.textContent = text;
            target.style.display = 'block';
        }

        if (!token) {
            document.querySelector('.brand p').textContent = t('password_reset.error_invalid');
            document.getElementById('reset-form').style.display = 'none';
        }

        document.getElementById('reset-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                showMessage('error', t('password_reset.error_mismatch'));
                return;
            }

            if (
                password.length < 8 ||
                !/[A-Z]/.test(password) ||
                !/[a-z]/.test(password) ||
                (!/[0-9]/.test(password) && !/[^A-Za-z0-9]/.test(password))
            ) {
                showMessage('error', t('password_reset.error_requirements'));
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });
                const result = await response.json();

                if (result.success) {
                    showMessage('success', t('password_reset.success'));
                    document.getElementById('reset-form').style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1800);
                } else {
                    showMessage('error', result.error || t('password_reset.error_invalid'));
                }
            } catch (error) {
                showMessage('error', t('common.error'));
            }
        });
    </script>
</body>

</html>
