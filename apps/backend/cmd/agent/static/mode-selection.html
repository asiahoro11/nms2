<!DOCTYPE html>
<!-- Made by YTSworks -->
<!-- YTS工作室製作 -->
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Mode</title>
    <script src="/static/js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 50%, #f0f4f8 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --input-bg: rgba(241, 245, 249, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background 0.3s ease;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px var(--shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            font-size: 2.2rem;
        }

        .logo-text {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .role-tag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.15);
            color: #6366f1;
        }

        body.dark-theme .role-tag {
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .mode-cards.single {
            grid-template-columns: 1fr;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-card {
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--input-bg);
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .mode-card.admin-card::before {
            background: linear-gradient(90deg, #3b82f6, #6366f1);
        }

        .mode-card.monitor-card::before {
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }

        .mode-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px var(--shadow);
        }

        .mode-card:hover::before {
            opacity: 1;
        }

        .mode-icon {
            font-size: 3rem;
            margin-bottom: 14px;
        }

        .mode-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .mode-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .mode-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .admin-card .mode-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
        }

        .monitor-card .mode-btn {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
        }

        .mode-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-text {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .logout-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: transparent;
            color: #ef4444;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: all 0.2s ease;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .lang-select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 6px 28px 6px 12px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 0.9em;
        }

        @media (max-width: 500px) {
            .mode-cards {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 28px 20px;
            }

            .footer-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="dark-theme">
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">
                    <span class="logo-text" id="ms-company-name">Management System</span>
                </div>
                <p class="welcome" id="ms-welcome">Select a mode to continue.</p>
                <div class="user-badge">
                    <span id="ms-user-icon">User</span>
                    <span id="ms-username">User</span>
                    <span class="role-tag" id="ms-role-tag">Role</span>
                </div>
            </div>

            <div class="mode-cards" id="ms-mode-cards"></div>

            <div class="footer-bar">
                <div class="footer-left">
                    <select class="lang-select" id="ms-lang-select" onchange="msChangeLang(this.value)">
                        <option value="zh-TW">繁中</option>
                        <option value="zh-CN">简中</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="ko-KR">한국어</option>
                    </select>
                    <div class="theme-toggle" onclick="msToggleTheme()">
                        <span id="ms-theme-icon" aria-hidden="true">&#9790;</span>
                        <span id="ms-theme-label">Theme</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="footer-text" data-app-version data-app-version-template="© 2026 {version}"></span>
                    <button class="logout-btn" id="ms-logout-btn" onclick="msLogout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MS_STRINGS = {
            'zh-TW': {
                welcome: '\u8acb\u9078\u64c7\u9032\u5165\u6a21\u5f0f',
                admin_title: '\u7ba1\u7406\u6a21\u5f0f',
                admin_desc: '\u9032\u5165\u5f8c\u53f0\u9032\u884c\u88dd\u7f6e\u3001\u62d3\u6a38\u3001\u8a18\u9304\u8207\u6388\u6b0a\u7ba1\u7406\u3002',
                admin_btn: '\u9032\u5165\u7ba1\u7406',
                monitor_title: '\u96fb\u8996\u7246\u6a21\u5f0f',
                monitor_desc: '\u9032\u5165\u53ea\u8b80\u96fb\u8996\u7246\u6a21\u5f0f\uff0c\u6aa2\u8996\u62d3\u6a38\u3001\u72c0\u614b\u8207\u4e8b\u4ef6\u8cc7\u8a0a\u3002',
                monitor_btn: '\u9032\u5165\u96fb\u8996\u7246',
                role_admin: '\u7ba1\u7406\u54e1',
                role_editor: '\u7de8\u8f2f\u8005',
                role_viewer: '\u6aa2\u8996\u8005',
                logout: '\u767b\u51fa',
                theme: '\u4e3b\u984c',
                title: '\u6a21\u5f0f\u9078\u64c7',
                user: '\u4f7f\u7528\u8005'
            },
            'zh-CN': {
                welcome: '\u8bf7\u9009\u62e9\u8fdb\u5165\u6a21\u5f0f',
                admin_title: '\u7ba1\u7406\u6a21\u5f0f',
                admin_desc: '\u8fdb\u5165\u540e\u53f0\u8fdb\u884c\u8bbe\u5907\u3001\u62d3\u6251\u3001\u65e5\u5fd7\u4e0e\u6388\u6743\u7ba1\u7406\u3002',
                admin_btn: '\u8fdb\u5165\u7ba1\u7406',
                monitor_title: '\u76d1\u63a7\u6a21\u5f0f',
                monitor_desc: '\u8fdb\u5165\u53ea\u8bfb\u76d1\u63a7\u753b\u9762\uff0c\u67e5\u770b\u62d3\u6251\u3001\u72b6\u6001\u4e0e\u4e8b\u4ef6\u4fe1\u606f\u3002',
                monitor_btn: '\u8fdb\u5165\u76d1\u63a7',
                role_admin: '\u7ba1\u7406\u5458',
                role_editor: '\u7f16\u8f91\u8005',
                role_viewer: '\u67e5\u770b\u8005',
                logout: '\u767b\u51fa',
                theme: '\u4e3b\u9898',
                title: '\u6a21\u5f0f\u9009\u62e9',
                user: '\u7528\u6237'
            },
            'en-US': {
                welcome: 'Select a mode to continue',
                admin_title: 'Admin Mode',
                admin_desc: 'Full management interface for topology, devices, logs, and license settings.',
                admin_btn: 'Enter Admin',
                monitor_title: 'Monitor Mode',
                monitor_desc: 'Read-only monitoring view with topology, status, and live events.',
                monitor_btn: 'Enter Monitor',
                role_admin: 'Admin',
                role_editor: 'Editor',
                role_viewer: 'Viewer',
                logout: 'Logout',
                theme: 'Theme',
                title: 'Select Mode',
                user: 'User'
            },
            'ja-JP': {
                welcome: '\u7d9a\u884c\u3059\u308b\u30e2\u30fc\u30c9\u3092\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044',
                admin_title: '\u7ba1\u7406\u30e2\u30fc\u30c9',
                admin_desc: '\u30c7\u30d0\u30a4\u30b9\u3001\u30c8\u30dd\u30ed\u30b8\u3001\u30ed\u30b0\u3001\u30e9\u30a4\u30bb\u30f3\u30b9\u3092\u7ba1\u7406\u3057\u307e\u3059\u3002',
                admin_btn: '\u7ba1\u7406\u753b\u9762\u3078',
                monitor_title: '\u76e3\u8996\u30e2\u30fc\u30c9',
                monitor_desc: '\u30c8\u30dd\u30ed\u30b8\u3001\u30b9\u30c6\u30fc\u30bf\u30b9\u3001\u30a4\u30d9\u30f3\u30c8\u3092\u53c2\u7167\u3059\u308b\u8aad\u307f\u53d6\u308a\u5c02\u7528\u753b\u9762\u3067\u3059\u3002',
                monitor_btn: '\u76e3\u8996\u753b\u9762\u3078',
                role_admin: '\u7ba1\u7406\u8005',
                role_editor: '\u7de8\u96c6\u8005',
                role_viewer: '\u95b2\u89a7\u8005',
                logout: '\u30ed\u30b0\u30a2\u30a6\u30c8',
                theme: '\u30c6\u30fc\u30de',
                title: '\u30e2\u30fc\u30c9\u9078\u629e',
                user: '\u30e6\u30fc\u30b6\u30fc'
            },
            'ko-KR': {
                welcome: '\uacc4\uc18d\ud560 \ubaa8\ub4dc\ub97c \uc120\ud0dd\ud558\uc138\uc694',
                admin_title: '\uad00\ub9ac \ubaa8\ub4dc',
                admin_desc: '\uc7a5\uce58, \ud1a0\ud3f4\ub85c\uc9c0, \ub85c\uadf8, \ub77c\uc774\uc120\uc2a4 \uc124\uc815\uc744 \uad00\ub9ac\ud569\ub2c8\ub2e4.',
                admin_btn: '\uad00\ub9ac \ud654\uba74\uc73c\ub85c',
                monitor_title: '\ubaa8\ub2c8\ud130 \ubaa8\ub4dc',
                monitor_desc: '\ud1a0\ud3f4\ub85c\uc9c0, \uc0c1\ud0dc, \uc2e4\uc2dc\uac04 \uc774\ubca4\ud2b8\ub97c \uc77d\uae30 \uc804\uc6a9\uc73c\ub85c \ud655\uc778\ud569\ub2c8\ub2e4.',
                monitor_btn: '\ubaa8\ub2c8\ud130 \ud654\uba74\uc73c\ub85c',
                role_admin: '\uad00\ub9ac\uc790',
                role_editor: '\ud3b8\uc9d1\uc790',
                role_viewer: '\uc5f4\ub78c\uc790',
                logout: '\ub85c\uadf8\uc544\uc6c3',
                theme: '\ud14c\ub9c8',
                title: '\ubaa8\ub4dc \uc120\ud0dd',
                user: '\uc0ac\uc6a9\uc790'
            }
        };

        let msLang = localStorage.getItem('nms_lang') || 'zh-TW';
        if (!MS_STRINGS[msLang]) {
            msLang = 'zh-TW';
        }

        function ms(key) {
            return (MS_STRINGS[msLang] || MS_STRINGS['zh-TW'])[key] || key;
        }

        function msSetLicenseLockState(locked, reason) {
            if (locked) {
                sessionStorage.setItem('nms_license_locked', 'true');
                if (reason) {
                    sessionStorage.setItem('nms_license_lock_reason', reason);
                } else {
                    sessionStorage.removeItem('nms_license_lock_reason');
                }
                return;
            }

            sessionStorage.removeItem('nms_license_locked');
            sessionStorage.removeItem('nms_license_lock_reason');
        }

        function getToken() {
            return sessionStorage.getItem('nms_token');
        }

        function getUser() {
            try {
                return JSON.parse(sessionStorage.getItem('nms_user'));
            } catch (_) {
                return null;
            }
        }

        function msApplyI18n() {
            document.getElementById('ms-welcome').textContent = ms('welcome');
            document.getElementById('ms-logout-btn').textContent = ms('logout');
            document.getElementById('ms-theme-label').textContent = ms('theme');
            document.getElementById('ms-lang-select').value = msLang;
            document.title = ms('title');
            msRenderCards();
        }

        function msChangeLang(lang) {
            msLang = lang;
            localStorage.setItem('nms_lang', lang);
            msApplyI18n();
        }

        function msToggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('nms-theme', isDark ? 'dark' : 'light');
            document.getElementById('ms-theme-icon').textContent = isDark ? '\u263e' : '\u2600';
        }

        function msApplySessionContext(user) {
            document.getElementById('ms-user-icon').textContent = ms('user');
            document.getElementById('ms-username').textContent = user.username || 'User';

            const roleMap = {
                admin: ms('role_admin'),
                editor: ms('role_editor'),
                viewer: ms('role_viewer')
            };
            document.getElementById('ms-role-tag').textContent = roleMap[user.role] || user.role || ms('role_viewer');

            fetch('/api/v1/branding')
                .then((response) => response.json())
                .then((payload) => {
                    if (!payload.success || !payload.data) {
                        return;
                    }

                    const name = document.getElementById('ms-company-name');
                    if (payload.data.company_name !== undefined && payload.data.company_name !== null) {
                        name.textContent = payload.data.company_name;
                    }
                })
                .catch(() => {});

            msApplyI18n();
        }

        function msRenderCards() {
            const user = getUser();
            const role = user ? user.role : null;
            const container = document.getElementById('ms-mode-cards');
            const canAdmin = role === 'admin' || role === 'editor';
            const cards = [];

            if (canAdmin) {
                cards.push(`
                    <div class="mode-card admin-card" onclick="msEnterAdmin()">
                        <div class="mode-title">${ms('admin_title')}</div>
                        <div class="mode-desc">${ms('admin_desc')}</div>
                        <button class="mode-btn" type="button" onclick="event.stopPropagation(); msEnterAdmin()">${ms('admin_btn')}</button>
                    </div>
                `);
            }

            cards.push(`
                <div class="mode-card monitor-card" onclick="msEnterMonitor()">
                    <div class="mode-title">${ms('monitor_title')}</div>
                    <div class="mode-desc">${ms('monitor_desc')}</div>
                    <button class="mode-btn" type="button" onclick="event.stopPropagation(); msEnterMonitor()">${ms('monitor_btn')}</button>
                </div>
            `);

            container.innerHTML = cards.join('');
            container.classList.toggle('single', cards.length === 1);
        }

        function msEnterAdmin() {
            const route = window.location.pathname.startsWith('/static/') ? '/static/index.html' : '/index.html';
            window.location.replace(route + '?_cb=' + Date.now());
        }

        function msEnterMonitor() {
            const token = getToken();
            const loginRoute = window.location.pathname.startsWith('/static/') ? '/static/login.html' : '/login';
            const monitorRoute = window.location.pathname.startsWith('/static/') ? '/static/monitor.html' : '/monitor.html';
            if (!token) {
                window.location.replace(loginRoute);
                return;
            }
            window.location.replace(monitorRoute + '?token=' + encodeURIComponent(token) + '&_cb=' + Date.now());
        }

        function msLogout() {
            sessionStorage.removeItem('nms_token');
            sessionStorage.removeItem('nms_user');
            sessionStorage.removeItem('nms_expires');
            sessionStorage.removeItem('nms_session_active');
            sessionStorage.removeItem('nms_active_page');
            msSetLicenseLockState(false, '');
            const loginRoute = window.location.pathname.startsWith('/static/') ? '/static/login.html' : '/login';
            window.location.replace(loginRoute);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('nms-theme');
            const isDark = savedTheme !== 'light';
            document.body.classList.toggle('dark-theme', isDark);
            document.getElementById('ms-theme-icon').textContent = isDark ? '\u263e' : '\u2600';

            const token = getToken();
            if (!token) {
                const loginRoute = window.location.pathname.startsWith('/static/') ? '/static/login.html' : '/login';
                window.location.replace(loginRoute);
                return;
            }

            fetch('/api/v1/auth/me', {
                headers: { Authorization: 'Bearer ' + token }
            })
                .then((response) => {
                    if (!response.ok) {
                        msLogout();
                        return null;
                    }
                    return response.json();
                })
                .then((payload) => {
                    if (!payload || !payload.success) {
                        return;
                    }

                    sessionStorage.setItem('nms_user', JSON.stringify(payload.data));
                    const user = payload.data;

                    return fetch('/api/v1/system/info', {
                        cache: 'no-store',
                        headers: {
                            Authorization: 'Bearer ' + token,
                            Pragma: 'no-cache',
                            'Cache-Control': 'no-cache'
                        }
                    })
                        .then((response) => (response.ok ? response.json() : null))
                        .then((systemInfo) => {
                            const info = systemInfo && systemInfo.success ? systemInfo.data : null;
                            if (info && info.license_locked) {
                                msSetLicenseLockState(true, info.license_lock_reason || 'license_required');
                                msEnterAdmin();
                                return;
                            }

                            msSetLicenseLockState(false, '');
                            msApplySessionContext(user);
                        })
                        .catch(() => {
                            msSetLicenseLockState(false, '');
                            msApplySessionContext(user);
                        });
                })
                .catch(() => {
                    msLogout();
                });
        });
    </script>
</body>

</html>
