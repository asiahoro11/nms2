    <style>
        :root {
            --login-bg: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 50%, #f0f4f8 100%);
            --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.9));
            --card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --input-bg: rgba(241, 245, 249, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --login-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(30, 41, 59, 0.85));
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--login-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            transition: background 0.3s ease;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .login-logo-icon {
            font-size: 2.5rem;
        }

        .login-logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .lang-select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .login-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ef4444;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #22c55e;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
        }

        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .login-footer-text {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: #60a5fa;
        }

        .theme-toggle-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-btn.loading .spinner {
            display: inline-block;
            margin-right: 8px;
        }

        .lang-select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }

            .login-footer {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="dark-theme">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img id="login-custom-logo" src="" alt="Logo" style="height: 48px; display: none;">
                    <span class="login-logo-icon" id="login-default-icon">N</span>
                    <span class="login-logo-text" id="login-company-name">Management System</span>
                </div>
                <h1 data-i18n="app.title">管理系統</h1>
                <p data-i18n="login.title">系統登入</p>
            </div>

            <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
                <div class="error-message" id="error-message"></div>

                <div class="form-group">
                    <label for="username" data-i18n="login.username">登入帳號</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required data-i18n="[placeholder]login.username">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password" data-i18n="login.password">登入密碼</label>
                        <a href="javascript:void(0)" onclick="toggleView('forgot')" style="font-size: 0.8rem; color: #60a5fa; text-decoration: none;" data-i18n="login.forgot_password">忘記密碼？</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required data-i18n="[placeholder]login.password">
                </div>

                <div class="form-group">
                    <label data-i18n="login.language">語系切換</label>
                    <div id="login-lang-container"></div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <span class="spinner"></span>
                    <span class="btn-text" data-i18n="login.login_btn">登入</span>
                </button>
            </form>

            <form class="login-form" id="twofactor-form" style="display: none;" onsubmit="handleTwoFactorLogin(event)">
                <div class="login-header" style="margin-bottom: 20px;">
                    <h2 style="font-size: 1.2rem; margin: 0; color: var(--text-primary);" id="twofactor-title">Two-Factor Authentication</h2>
                    <p style="font-size: 0.85rem; margin-top: 5px;" id="twofactor-description">Enter the code to complete sign in.</p>
                </div>

                <div class="error-message" id="twofactor-error-message"></div>

                <div class="form-group">
                    <label for="twofactor-code" id="twofactor-code-label">Verification Code / Backup Code</label>
                    <input type="text" id="twofactor-code" name="code" placeholder="Enter verification code or backup code" autocomplete="one-time-code" required>
                </div>

                <button type="submit" class="login-btn" id="twofactor-btn">
                    <span class="spinner"></span>
                    <span class="btn-text" id="twofactor-submit-text">Verify and Login</span>
                </button>

                <div style="text-align: center; margin-top: 10px;">
                    <a href="javascript:void(0)" onclick="cancelTwoFactor()" style="font-size: 0.9rem; color: #60a5fa; text-decoration: none;" id="twofactor-back-link">Back to login</a>
                </div>
            </form>

            <form class="login-form" id="forgot-form" style="display: none;" onsubmit="handleRequestReset(event)">
                <div class="login-header" style="margin-bottom: 20px;">
                    <h2 style="font-size: 1.2rem; margin: 0; color: var(--text-primary);" data-i18n="login.request_reset_title">重設您的密碼</h2>
                    <p style="font-size: 0.85rem; margin-top: 5px;" data-i18n="login.request_reset_desc">請輸入您註冊的 Email，將發送重設語法到您的信箱。</p>
                </div>

                <div class="error-message" id="forgot-error-message"></div>
                <div id="forgot-success-message" class="success-message">
                    <strong data-i18n="login.reset_success_msg">重設指令已發出</strong><br>
                    <span style="font-size: 0.8rem;" data-i18n="login.reset_success_desc">如果此 Email 已註冊，您將在幾分鐘內收到重設信件。請檢查您的信箱 (包含垃圾郵件)。</span>
                </div>

                <div class="form-group">
                    <label for="forgot-email" data-i18n="login.email">電子郵件 (Email)</label>
                    <input type="email" id="forgot-email" name="email" placeholder="user@example.com" required data-i18n="[placeholder]login.email_placeholder">
                </div>

                <button type="submit" class="login-btn" id="forgot-btn">
                    <span class="spinner"></span>
                    <span class="btn-text" data-i18n="login.send_reset_link">發送重設信件</span>
                </button>

                <div style="text-align: center; margin-top: 10px;">
                    <a href="javascript:void(0)" onclick="toggleView('login')" style="font-size: 0.9rem; color: #60a5fa; text-decoration: none;" data-i18n="login.back_to_login">返回登入</a>
                </div>
            </form>

            <div class="login-footer">
                <span class="login-footer-text">(C) 2026 <span style="font-size:10px; opacity:0.7" data-app-version></span></span>
                <div class="theme-toggle" onclick="toggleLoginTheme()">
                    <span id="theme-toggle-icon">SUN</span>
                    <span class="theme-toggle-label" data-i18n="common.theme">主題</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('nms-theme');
            const isDark = savedTheme !== 'light';
            document.body.classList.toggle('dark-theme', isDark);
            document.getElementById('theme-toggle-icon').textContent = isDark ? 'SUN' : 'MOON';
        })();

        let pendingTwoFactorChallenge = null;
        let pendingTwoFactorMethod = '';
        let pendingTwoFactorUsername = '';

        function translate(key, fallback) {
            return typeof t === 'function' ? (t(key) || fallback) : fallback;
        }

        function toggleLoginTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('nms-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle-icon').textContent = isDark ? 'SUN' : 'MOON';
        }

        function toggleView(view) {
            const loginForm = document.getElementById('login-form');
            const twoFactorForm = document.getElementById('twofactor-form');
            const forgotForm = document.getElementById('forgot-form');
            const titleEl = document.querySelector('.login-header h1');
            const descEl = document.querySelector('.login-header p');

            if (view === 'forgot') {
                loginForm.style.display = 'none';
                twoFactorForm.style.display = 'none';
                forgotForm.style.display = 'flex';
                if (titleEl) titleEl.style.display = 'none';
                if (descEl) descEl.style.display = 'none';
                document.getElementById('forgot-email').focus();
            } else if (view === '2fa') {
                loginForm.style.display = 'none';
                twoFactorForm.style.display = 'flex';
                forgotForm.style.display = 'none';
                if (titleEl) titleEl.style.display = 'none';
                if (descEl) descEl.style.display = 'none';
                document.getElementById('twofactor-code').focus();
            } else {
                loginForm.style.display = 'flex';
                twoFactorForm.style.display = 'none';
                forgotForm.style.display = 'none';
                if (titleEl) titleEl.style.display = 'block';
                if (descEl) descEl.style.display = 'block';
                document.getElementById('username').focus();
            }
        }

        function cancelTwoFactor() {
            pendingTwoFactorChallenge = null;
            pendingTwoFactorMethod = '';
            pendingTwoFactorUsername = '';
            document.getElementById('twofactor-form').reset();
            const errorEl = document.getElementById('twofactor-error-message');
            errorEl.classList.remove('show');
            errorEl.textContent = '';
            toggleView('login');
        }
    </script>
    <script>
        writeConfiguredScripts([
            '/static/js/i18n.js'
        ]);
    </script>
    <script>
        if (!localStorage.getItem('nms_lang')) {
            localStorage.setItem('nms_lang', 'zh-TW');
        }

        async function refreshLoginCaches() {
            const currentVersion = typeof getAssetVersion === 'function' ? getAssetVersion() : 'v1.2.4-poc-ui1';

            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map((registration) => registration.update().catch(() => undefined)));
                } catch (_) {
                    // Best effort only.
                }
            }

            if ('caches' in window) {
                try {
                    const cacheKeys = await caches.keys();
                    await Promise.all(
                        cacheKeys
                            .filter((key) => key.startsWith('sync-') && key !== `sync-${currentVersion}`)
                            .map((key) => caches.delete(key))
                    );
                } catch (_) {
                    // Best effort only.
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await refreshLoginCaches();

            setTimeout(() => {
                if (typeof applyTranslations === 'function') {
                    applyTranslations();
                }
                if (typeof renderLanguageSwitcher === 'function') {
                    renderLanguageSwitcher();
                }
            }, 100);
        });

        fetch('/api/v1/branding')
            .then((res) => res.json())
            .then((data) => {
                if (!data.success || !data.data) {
                    return;
                }

                const logoContainer = document.querySelector('.login-logo');
                const logoImg = document.getElementById('login-custom-logo');
                const defaultIcon = document.getElementById('login-default-icon');
                const companyName = document.getElementById('login-company-name');
                const branding = data.data;

                if (branding.logo_path) {
                    logoImg.src = branding.logo_path;
                    logoImg.style.display = 'block';
                    defaultIcon.style.display = 'none';
                } else {
                    logoImg.style.display = 'none';
                    defaultIcon.style.display = 'none';
                }

                if (branding.company_name !== undefined && branding.company_name !== null) {
                    companyName.textContent = branding.company_name;
                    if (branding.company_name) {
                        document.title = branding.company_name + ' - Login';
                    }
                }

                if (branding.font_size) {
                    companyName.style.setProperty('font-size', branding.font_size + 'px', 'important');
                }
                if (branding.font_color) {
                    companyName.style.color = branding.font_color;
                    companyName.style.webkitTextFillColor = branding.font_color;
                    companyName.style.background = 'none';
                }

                if (branding.name_position && logoContainer) {
                    const position = branding.name_position;
                    logoContainer.style.display = 'flex';
                    logoContainer.style.alignItems = 'center';

                    if (position === 'top') {
                        logoContainer.style.flexDirection = 'column-reverse';
                    } else if (position === 'bottom') {
                        logoContainer.style.flexDirection = 'column';
                    } else if (position === 'left') {
                        logoContainer.style.flexDirection = 'row-reverse';
                    } else {
                        logoContainer.style.flexDirection = 'row';
                    }
                }
            })
            .catch(() => {});
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isRestored = urlParams.get('restored') === 'true';
        const token = sessionStorage.getItem('nms_token');

        if (token && !isRestored) {
            fetch('/api/v1/auth/me', {
                headers: { Authorization: 'Bearer ' + token }
            }).then((res) => {
                if (res.ok) {
                    const modeSelectionRoute = window.location.pathname.startsWith('/static/') ? '/static/mode-selection.html' : '/mode-selection.html';
                    window.location.href = modeSelectionRoute;
                } else {
                    sessionStorage.removeItem('nms_token');
                    sessionStorage.removeItem('nms_user');
                }
            }).catch(() => {
                sessionStorage.removeItem('nms_token');
                sessionStorage.removeItem('nms_user');
            });
        }

        async function handleLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-message');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!username || !password) {
                showError(translate('login.error_required', 'Please enter username and password.'));
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch (_) {
                    throw new Error('Server returned invalid JSON');
                }

                if (data.success) {
                    if (data.data && data.data.requires_two_factor) {
                        pendingTwoFactorChallenge = data.data.challenge_token;
                        pendingTwoFactorMethod = data.data.two_factor_method || '';
                        pendingTwoFactorUsername = data.data.user?.username || username;
                        showTwoFactorStep(pendingTwoFactorMethod);
                    } else {
                        completeLoginSuccess(data.data);
                    }
                } else {
                    showError(data.error || translate('login.error_failed', 'Login failed.'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(translate('login.error_connection', 'Connection failed. Please try again later.'));
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function handleTwoFactorLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('twofactor-btn');
            const errorEl = document.getElementById('twofactor-error-message');
            const code = document.getElementById('twofactor-code').value.trim();

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!pendingTwoFactorChallenge) {
                errorEl.textContent = 'The login verification has expired. Please sign in again.';
                errorEl.classList.add('show');
                return;
            }

            if (!code) {
                errorEl.textContent = 'Please enter the verification code.';
                errorEl.classList.add('show');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/auth/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: pendingTwoFactorUsername,
                        code,
                        method: pendingTwoFactorMethod,
                        challenge_token: pendingTwoFactorChallenge
                    })
                });

                const data = await response.json();
                if (data.success) {
                    completeLoginSuccess(data.data);
                } else {
                    errorEl.textContent = data.error || 'Verification failed.';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                console.error('2FA verify error:', error);
                errorEl.textContent = 'Verification failed. Please try again later.';
                errorEl.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function showTwoFactorStep(method) {
            const errorEl = document.getElementById('twofactor-error-message');
            const descEl = document.getElementById('twofactor-description');
            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (method === 'email_otp') {
                descEl.textContent = 'A verification code has been sent to your email address.';
            } else {
                descEl.textContent = 'Enter the authenticator code or one of your backup codes.';
            }

            toggleView('2fa');
        }

        function completeLoginSuccess(data) {
            sessionStorage.setItem('nms_token', data.token);
            sessionStorage.setItem('nms_user', JSON.stringify(data.user));

            if (data.expires_at) {
                sessionStorage.setItem('nms_expires', data.expires_at);
            }

            sessionStorage.setItem('nms_session_active', 'true');

            if (data.require_password_change) {
                sessionStorage.setItem('nms_require_pwd_change', 'true');
            } else {
                sessionStorage.removeItem('nms_require_pwd_change');
            }

            sessionStorage.removeItem('nms_active_page');
            pendingTwoFactorChallenge = null;
            pendingTwoFactorMethod = '';
            pendingTwoFactorUsername = '';

            const modeSelectionRoute = window.location.pathname.startsWith('/static/') ? '/static/mode-selection.html' : '/mode-selection.html';
            window.location.replace(modeSelectionRoute + '?_cb=' + Date.now());
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        async function handleRequestReset(event) {
            event.preventDefault();
            const btn = document.getElementById('forgot-btn');
            const email = document.getElementById('forgot-email').value;
            const errorEl = document.getElementById('forgot-error-message');
            const successEl = document.getElementById('forgot-success-message');

            errorEl.classList.remove('show');
            errorEl.textContent = '';
            successEl.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                if (data.success) {
                    successEl.classList.add('show');
                    document.getElementById('forgot-form').reset();
                } else {
                    errorEl.textContent = data.error || 'Unable to send the reset link.';
                    errorEl.classList.add('show');
                }
            } catch (_) {
                errorEl.textContent = 'System error. Please try again later.';
                errorEl.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        document.getElementById('username').focus();
    </script>
</body>

</html>
